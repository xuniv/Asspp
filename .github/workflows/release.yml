name: Unsigned Release
on:
  push:
    tags: ['4.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing release whose AltStore package should be regenerated
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ipatool/sap
          key: public-apple-macos27-26A434-arm64-v5
      - name: Build the pinned client interpreter and public assets
        run: bash Resources/Scripts/prepare.store.runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Asspp-client-runtime
          path: StoreRuntime.bundle
          retention-days: 3
          if-no-files-found: error
  build:
    needs: runtime
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Asspp-client-runtime
          path: StoreRuntime.bundle
      - name: Select stable Xcode
        run: bash Resources/Scripts/select.xcode.sh
      - name: Check the bundled WKWebView interpreter offline
        if: matrix.platform == 'ios'
        run: bash Resources/Scripts/check.store.runtime.sh
      - name: Build and verify unsigned package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = ios ]; then
            bash Resources/Scripts/check.downloads.sh
            bash Resources/Scripts/check.authentication-installer.sh
            zsh Resources/Scripts/compile.release.mobile.ci.sh "$PWD" "$RUNNER_TEMP/Asspp.ipa"
            python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp.ipa"
            python3 Resources/Scripts/prepare.alt.ipa.py "$RUNNER_TEMP/Asspp.ipa" "$RUNNER_TEMP/Asspp-AltStore.ipa"
            python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp-AltStore.ipa"
          else
            zsh Resources/Scripts/compile.release.osx.sh "$PWD" "$RUNNER_TEMP/Asspp.zip"
            python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Asspp-${{ matrix.platform }}-unsigned-release
          path: |
            ${{ runner.temp }}/Asspp.ipa
            ${{ runner.temp }}/Asspp-AltStore.ipa
            ${{ runner.temp }}/Asspp.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Asspp-*-unsigned-release
          merge-multiple: true
          path: release
      - name: Publish verified unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Asspp.ipa release/Asspp-AltStore.ipa release/Asspp.zip --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file Resources/ReleaseNotes.md
  source-package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regenerate the unsigned AltStore package from the public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^4\.[0-9]+\.[0-9]+$ ]]
          cd "$RUNNER_TEMP"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern Asspp.ipa
          export EXPECTED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq '.assets[] | select(.name == "Asspp.ipa") | .digest')"
          python3 - <<'PY'
          import hashlib, os, pathlib
          expected = os.environ['EXPECTED_SHA']
          actual = 'sha256:' + hashlib.sha256(pathlib.Path('Asspp.ipa').read_bytes()).hexdigest()
          if expected != actual:
              raise SystemExit('public source IPA digest mismatch')
          PY
          python3 "$GITHUB_WORKSPACE/Resources/Scripts/check.release.privacy.py" Asspp.ipa
          python3 "$GITHUB_WORKSPACE/Resources/Scripts/prepare.alt.ipa.py" Asspp.ipa Asspp-AltStore.ipa
          python3 "$GITHUB_WORKSPACE/Resources/Scripts/check.release.privacy.py" Asspp-AltStore.ipa
          gh release upload "$RELEASE_VERSION" Asspp-AltStore.ipa --repo "$GITHUB_REPOSITORY" --clobber
