name: Unsigned Release
on:
  push:
    tags: ['4.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Xcode
        run: bash Resources/Scripts/select.xcode.sh
      - name: Check protocols and certificates
        run: |
          bash Resources/Scripts/check.downloads.sh
          bash Resources/Scripts/check.authentication-installer.sh
      - name: Build unsigned iOS package
        run: zsh Resources/Scripts/compile.release.mobile.ci.sh "$PWD" "$RUNNER_TEMP/Asspp.ipa"
      - name: Build unsigned macOS package
        run: zsh Resources/Scripts/compile.release.osx.sh "$PWD" "$RUNNER_TEMP/Asspp.zip"
      - name: Check release privacy
        run: python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp.ipa" "$RUNNER_TEMP/Asspp.zip"
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/Asspp.ipa" "$RUNNER_TEMP/Asspp.zip" \
            --title "$GITHUB_REF_NAME" --notes-file Resources/ReleaseNotes.md
