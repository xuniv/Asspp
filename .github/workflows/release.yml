name: Verified unsigned iOS release
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit (40 hex characters)
        required: true
        type: string
      release_version:
        description: Version already set in Configuration/Version.xcconfig
        required: true
        type: string
      publish:
        description: Publish these same verified artifacts after all checks pass
        default: false
        type: boolean
      runtime_only:
        description: Recheck an existing release; only verification files may differ
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: verified-ios-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'xuniv/Asspp'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact reviewed revision and version
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH: ${{ inputs.publish }}
          RUNTIME_ONLY: ${{ inputs.runtime_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          sha=os.environ['EXPECTED_SHA']; version=os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[0-9a-f]{40}',sha) and sha==os.environ['GITHUB_SHA'], 'Source revision changed'
          assert re.fullmatch(r'4\.\d+\.\d+',version), 'Invalid version'
          config=pathlib.Path('Configuration/Version.xcconfig').read_text()
          assert re.search(r'^MARKETING_VERSION\s*=\s*'+re.escape(version)+r'\s*$',config,re.M), 'Version mismatch'
          runtime_only=os.environ['RUNTIME_ONLY']=='true'
          assert not (runtime_only and os.environ['PUBLISH']=='true'), 'Verification cannot publish'
          if runtime_only or os.environ['PUBLISH']=='true': assert os.environ['GITHUB_REF']=='refs/heads/main', 'Use main for release verification or publication'
          script=pathlib.Path('Resources/Scripts/prepare.store.runtime.sh').read_text()
          assert re.search(r'^revision=[0-9a-f]{40}$',script,re.M), 'Native source must be pinned'
          PY
          git diff --check
          bash -n Resources/Scripts/prepare.store.runtime.sh Resources/Scripts/check.store.runtime.ios.sh
          python3 - <<'PY'
          import json,os,subprocess
          version=os.environ['RELEASE_VERSION']
          if os.environ['RUNTIME_ONLY']=='true':
              repo=os.environ['GITHUB_REPOSITORY']
              subprocess.run(['gh','api',f'repos/{repo}/releases/tags/{version}'],check=True,stdout=subprocess.DEVNULL)
              released_sha=subprocess.check_output(['gh','api',f'repos/{repo}/commits/{version}','--jq','.sha'],text=True).strip()
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',released_sha],check=True)
              changed=subprocess.check_output(['git','diff','--name-only',released_sha,os.environ['EXPECTED_SHA']],text=True).splitlines()
              assert set(changed)<= {'.github/workflows/release.yml','Resources/Scripts/check.store.runtime.ios.sh'}, 'Released application or runtime sources changed'
              raise SystemExit(0)
          result=subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/tags/{version}'],text=True,capture_output=True)
          if result.returncode==0:
              assert json.loads(result.stdout)['object']['sha']==os.environ['EXPECTED_SHA'], 'Existing tag points to another source'
          else:
              assert 'Not Found' in result.stderr, 'Cannot verify release tag'
          if os.environ['PUBLISH']=='true':
              release=subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{version}'],text=True,capture_output=True)
              assert release.returncode!=0 and 'Not Found' in release.stderr, 'Release already exists or cannot be verified'
          PY
  build:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ipatool/sap
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: native-tci-ios-v1-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: build/DerivedDataApp/SourcePackages
          key: asspp-spm-xcode27-${{ hashFiles('**/Package.resolved') }}
      - name: Select stable Xcode
        run: bash Resources/Scripts/select.xcode.sh
      - name: Identify the native build toolchain
        id: native-toolchain
        run: |
          python3 - <<'PYTOOLS'
          import hashlib,os,subprocess
          digest=hashlib.sha256()
          for command in [['xcodebuild','-version'],['xcrun','--sdk','iphoneos','--show-sdk-build-version'],['xcrun','--sdk','iphonesimulator','--show-sdk-build-version'],['go','version'],['cmake','--version']]:
              output=subprocess.check_output(command)
              digest.update(len(output).to_bytes(8,'big')); digest.update(output)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('digest='+digest.hexdigest()+'\n')
          PYTOOLS
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            NativeRuntime
            StoreRuntime.bundle
          key: native-ios-libraries-v1-${{ runner.arch }}-${{ steps.native-toolchain.outputs.digest }}-${{ hashFiles('Resources/Scripts/prepare.store.runtime.sh') }}
      - name: Build only device and simulator native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ASSPP_NATIVE_TARGETS: ios-arm64 ios-simulator-arm64
        run: bash Resources/Scripts/prepare.store.runtime.sh
      - name: Verify the native source revision before execution
        run: |
          python3 - <<'PY'
          import pathlib,re
          script=pathlib.Path('Resources/Scripts/prepare.store.runtime.sh').read_text()
          expected=re.search(r'^revision=([0-9a-f]{40})$',script,re.M).group(1)
          assert pathlib.Path('NativeRuntime/source-revision.txt').read_text().strip()==expected, 'Native cache source mismatch'
          assert pathlib.Path('StoreRuntime.bundle/upstream-revision.txt').read_text().strip()=='b352566155a667d8aaeabaa7ecec4966080f92ab', 'Protocol source mismatch'
          PY
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            NativeRuntime
            StoreRuntime.bundle
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Check downloads, authentication and install certificates
        run: |
          bash Resources/Scripts/check.downloads.sh
          bash Resources/Scripts/check.authentication-installer.sh
      - name: Build and verify unsigned IPA packages
        if: inputs.runtime_only != true
        run: |
          zsh Resources/Scripts/compile.release.mobile.ci.sh "$PWD" "$RUNNER_TEMP/Asspp.ipa"
          python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp.ipa"
          python3 Resources/Scripts/prepare.alt.ipa.py "$RUNNER_TEMP/Asspp.ipa" "$RUNNER_TEMP/Asspp-AltStore.ipa"
          python3 Resources/Scripts/check.release.privacy.py "$RUNNER_TEMP/Asspp-AltStore.ipa"
      - name: Check native iOS runtime before publishing the application
        env:
          SIMCTL_CHILD_ASS_RUNTIME_LIVE_APPLE: '1'
        run: |
          result="$RUNNER_TEMP/native-ios-check-passed"
          rm -f "$result"
          ASSPP_NATIVE_CHECK_RESULT="$result" bash Resources/Scripts/check.store.runtime.ios.sh
          test -f "$result"
          test "$(cat "$result")" = passed
      - uses: actions/upload-artifact@v4
        if: inputs.runtime_only != true
        with:
          name: verified-unsigned-ios
          path: |
            ${{ runner.temp }}/Asspp.ipa
            ${{ runner.temp }}/Asspp-AltStore.ipa
          retention-days: 1
          if-no-files-found: error
  publish:
    if: inputs.publish && !inputs.runtime_only && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-unsigned-ios
          path: release
      - name: Publish the same checked packages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          version=os.environ['RELEASE_VERSION']; repo=os.environ['GITHUB_REPOSITORY']
          tag=subprocess.run(['gh','api',f'repos/{repo}/git/ref/tags/{version}'],text=True,capture_output=True)
          if tag.returncode==0:
              commit=subprocess.check_output(['gh','api',f'repos/{repo}/commits/{version}','--jq','.sha'],text=True).strip()
              assert commit==os.environ['GITHUB_SHA'], 'Release tag changed after preflight'
          else:
              assert 'Not Found' in tag.stderr, 'Cannot recheck release tag'
          PY
          gh release create "$RELEASE_VERSION" release/Asspp.ipa release/Asspp-AltStore.ipa \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file Resources/ReleaseNotes.md
      - name: Remove this run's temporary packages after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "verified-unsigned-ios") | .id' > "$RUNNER_TEMP/artifact-ids"
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/artifact-ids"
