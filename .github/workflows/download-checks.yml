name: Protocol and installer checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check downloads and localization
        run: bash Resources/Scripts/check.downloads.sh
      - name: Check authentication, install URLs, and CA profile
        run: bash Resources/Scripts/check.authentication-installer.sh
